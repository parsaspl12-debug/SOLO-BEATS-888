<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورود ادمین | SOLO BEATS</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="logo-title">SOLO BEATS</h1>
      <p class="auth-sub">ورود به پنل مدیریت</p>
      <form method="post">
        <input type="password" name="password" placeholder="رمز عبور" required autofocus>
        <button type="submit">ورود</button>
      </form>
      {% if error %}
      <p class="auth-error">{{ error }}</p>
      {% endif %}
      <a class="back-link" href="/">بازگشت به صفحه اصلی</a>
    </div>
  </div>
</body>
</html>
