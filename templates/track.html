<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script>(function(){try{var t=localStorage.getItem('sb_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>{{ item.display_name }} | SOLO BEATS</title>

<meta property="og:type" content="music.song" />
<meta property="og:title" content="{{ item.display_name }} | SOLO BEATS" />
<meta property="og:description" content="گوش کن به «{{ item.display_name }}» ({{ item.category }}) از SOLO BEATS" />
<meta property="og:url" content="{{ request.url }}" />
{% if item.cover %}
<meta property="og:image" content="{{ request.url_root.rstrip('/') }}{{ item.cover }}" />
{% endif %}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ item.display_name }} | SOLO BEATS" />
<meta name="twitter:description" content="گوش کن به «{{ item.display_name }}» از SOLO BEATS" />

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png" />
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}" />
</head>
<body data-track-name="{{ item.name }}" data-track-display="{{ item.display_name }}">

<div class="topbar">
  <a href="/" class="icon-btn" title="بازگشت" style="text-decoration:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="brand-wrap">
    <div class="brand-pulse">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SOLO BEATS" class="brand-logo-img">
      <h1 class="logo-title">SOLO BEATS</h1>
    </div>
  </div>
  <div></div>
</div>

<div class="track-page">
  {% if item.cover %}
  <div class="cover-wrapper track-page-cover">
    <img src="{{ item.cover }}" alt="کاور {{ item.display_name }}">
  </div>
  {% endif %}

  <h2 class="track-page-title">{{ item.display_name }}</h2>
  <div class="track-meta" style="justify-content:center; gap:16px;">
    <span class="track-category">{{ item.category }}</span>
    <span class="track-plays">▶ <span class="plays-count" data-track="{{ item.name }}">{{ item.plays }}</span></span>
  </div>

  <div class="player" style="margin-top:20px;">
    <audio preload="none" style="display:none;">
      <source src="/static/Music/{{ item.name }}">
    </audio>
    <div class="player-bar">
      <button type="button" class="play-pause-btn" aria-label="پخش">
        <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
      </button>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <input type="range" class="seek-bar" min="0" max="100" value="0" step="0.1">
      </div>
      <span class="player-time">0:00</span>
      <div class="volume-pop-wrap">
        <button type="button" class="mute-btn" aria-label="صدا">
          <svg class="icon-vol" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5z"/></svg>
          <svg class="icon-mute" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="display:none;"><path d="M5 9v6h4l5 5V4L9 9H5z"/><path d="M19 9l-4 4m0-4l4 4"/></svg>
        </button>
        <div class="volume-pop">
          <input type="range" class="volume-bar" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>
  </div>

  <div class="card-actions" style="justify-content:center; margin-top:18px;">
    <a class="button solid" href="/download/{{ item.name }}">دانلود</a>
    <button type="button" class="button" onclick="sbShare('{{ item.display_name|e }}', window.location.href, this)">اشتراک‌گذاری</button>
  </div>

  {% if item.lyrics %}
  <div class="lyrics-box" style="max-height:none; margin-top:26px; text-align:center;">{{ item.lyrics }}</div>
  {% endif %}
</div>

<div class="now-playing" id="nowPlaying">
  <span class="np-eq" id="npEq"><span></span><span></span><span></span><span></span><span></span></span>
  <span class="np-name" id="npName">—</span>
  <button type="button" id="npToggle" title="توقف/پخش">
    <svg id="npIconPause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    <svg id="npIconPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
